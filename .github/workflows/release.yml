name: Publish images

# Publishing is deliberate, not a side effect of a push: a version tag or the button.
# The images are enrico1203/tgbackup-backend and enrico1203/tgbackup-frontend on Docker
# Hub, which is what docker-compose.hub.yml pulls.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NAMESPACE: enrico1203

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        # Each architecture is built on a runner of that architecture. Under QEMU the
        # Rust compilation of cryptg alone would take the better part of an hour.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # linux/amd64 is not usable as an artifact name or a cache scope.
      - name: Platform as a name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      # The version goes into both images so a running installation can compare itself
      # with what is on Docker Hub. On the button, where the ref is a branch and not a
      # tag, it stays "dev": that build publishes `latest` alone and is no release.
      - name: Version from the tag
        run: |
          case "$REF_NAME" in
            v[0-9]*) echo "APP_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV" ;;
            *)       echo "APP_VERSION=dev" >> "$GITHUB_ENV" ;;
          esac
        env:
          REF_NAME: ${{ github.ref_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.NAMESPACE }}/tgbackup-${{ matrix.image }}

      # Pushed by digest and with no tag: this half of the image is not usable on its
      # own. The tags go on the manifest list that the merge job assembles.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          outputs: type=image,name=${{ env.NAMESPACE }}/tgbackup-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}

      # The digest is the whole payload: an empty file whose name is the digest is
      # enough for the merge job, which needs nothing else from here.
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest for ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A tag v1.2.3 publishes 1.2.3, 1.2 and latest. The button publishes latest alone,
      # which is what an untagged main is worth.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.NAMESPACE }}/tgbackup-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.NAMESPACE }}/tgbackup-${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect what was published
        run: |
          docker buildx imagetools inspect \
            ${{ env.NAMESPACE }}/tgbackup-${{ matrix.image }}:${{ steps.meta.outputs.version }}

  # The page on Docker Hub is the only documentation somebody who never opens GitHub
  # will read, and an empty one next to a pull command is worth nothing. It is rewritten
  # from the README at every publication rather than kept by hand, where it would drift.
  description:
    name: Docker Hub page for ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            summary: API, scheduler and transfers of tgbackup, folders and rclone remotes into Telegram
          - image: frontend
            summary: Web interface of tgbackup, the built React application served by nginx
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite the page from the README
        env:
          # Docker Hub refuses a full_description longer than 25,000 characters, and the
          # README crossed it between 0.5.1 and 0.6.0: the PATCH came back 400, curl exited
          # 22 and the release went red after the images had already been pushed. Trimming
          # the README to fit would be the tail wagging the dog, since it is also the page
          # somebody lands on from GitHub, so the page takes as many whole sections as it
          # can and says where the rest is.
          LIMIT: "25000"
          # Read by jq out of the environment and never passed as an argument, which on
          # a shared runner would put the token in the process list.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUMMARY: ${{ matrix.summary }}
          REPOSITORY: ${{ env.NAMESPACE }}/tgbackup-${{ matrix.image }}
        run: |
          notice=$'\n---\n\nThe documentation continues in the README on GitHub:\nhttps://github.com/'"${GITHUB_REPOSITORY}"$'#readme\n'
          budget=$(( LIMIT - ${#notice} - 200 ))

          # Whole sections, cut at a "## " heading: half a section reads as a page that
          # was damaged, while a page that stops at a heading reads as a page that ends.
          page=$(awk -v budget="$budget" '
            /^## / {
              if (!full && length(out) + length(buf) <= budget) out = out buf; else full = 1
              buf = ""
            }
            !full { buf = buf $0 "\n" }
            END {
              if (!full && length(out) + length(buf) <= budget) out = out buf
              # A first section already over the budget would leave nothing at all.
              printf "%s", (out == "" ? substr(buf, 1, budget) : out)
            }' README.md)

          if [ "${#page}" -lt "$(wc -m < README.md)" ]; then
            page="${page}${notice}"
            echo "README trimmed to $(printf %s "$page" | wc -m) of the $LIMIT characters allowed"
          fi

          jwt=$(jq -n '{username: env.DOCKERHUB_USERNAME, password: env.DOCKERHUB_TOKEN}' \
            | curl -sf -H 'Content-Type: application/json' -d @- \
                https://hub.docker.com/v2/users/login/ \
            | jq -r .token)

          # The slice is the belt to the awk braces: whatever the counting, what leaves
          # here fits, and this step never turns a published release red again.
          PAGE="$page" jq -n --argjson limit "$LIMIT" \
              '{description: env.SUMMARY, full_description: env.PAGE[0:$limit]}' \
            | curl -sf -X PATCH -o /dev/null \
                -H 'Content-Type: application/json' -H "Authorization: JWT $jwt" \
                -d @- "https://hub.docker.com/v2/repositories/${REPOSITORY}/"

          echo "Page of ${REPOSITORY} rewritten from the README"
