server {
    listen 80;
    # Also on 8081 because the Cloudflare tunnel ingress points at frontend:8081.
    # The 8081 published on the host is a different thing: that one maps to the internal 80.
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # File content never travels through here, it goes straight to Telegram. The one upload
    # from the browser is a channel export, a gzipped index: a few megabytes for tens of
    # thousands of files, and the backend refuses anything above 64 MB anyway.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Linking a Telegram account waits for the code, and listing a remote can take a
        # while: no short timeouts here.
        proxy_read_timeout 900s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The progress socket stays open for the whole duration of a job.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
