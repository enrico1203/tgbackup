services:
  backend:
    # A build from the sources is "dev" and never claims to be out of date: it is not a
    # release and there is nothing to compare it with. Setting APP_VERSION stamps the
    # image with that version instead, which is how the update banner can be seen at
    # work without publishing anything.
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET}
      TZ: ${TZ:-Europe/Rome}
      DATA_DIR: /data
    volumes:
      # SQLite database, rclone configuration and files rebuilt by restore
      - ./data:/data
      # Folders to back up to Telegram, always read-only.
      # Add more below in the same form, then: docker compose up -d --no-deps backend
      - /mnt/documenti:/mnt/documenti:ro
      - /mnt/jotta2:/mnt/jotta2:ro
      # Destination of a download job, the only volume that is written. Without :ro, and
      # never the same folder as one of the sources above.
      # - /mnt/ripristino:/mnt/ripristino
    networks:
      - tgbackup

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    networks:
      - tgbackup

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - tgbackup

networks:
  tgbackup:
    driver: bridge
