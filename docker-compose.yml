services:
  backend:
    # The version the update banner compares with Docker Hub. It is passed in on the
    # command line and comes from git, never written down here or in .env: a number kept
    # by hand goes stale at the first release nobody remembers to copy, and the banner
    # would then announce an update to the version already running. `git describe` says
    # 0.6.0 only on a working copy sitting exactly on v0.6.0; one commit further on it
    # says 0.6.0-1-gabc1234, which does not read as X.Y.Z and is compared with nothing.
    #   APP_VERSION="$(git describe --tags --always --dirty | sed s/^v//)" \
    #     docker compose up -d --no-deps --build backend frontend
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET}
      TZ: ${TZ:-Europe/Rome}
      DATA_DIR: /data
      # How long a 512KB part may go unanswered before its connection is rebuilt and the
      # part sent again. The default in config.py is 120s, which is the safe value for a
      # line nobody has measured; here a part comes back in about a second at 9 MB/s, so
      # forty five is still forty five times the margin and it cuts the cost of one of
      # these cuts from two minutes to under one. Raise it on a slow uplink: the price of
      # a deadline that is too short is the same part sent twice.
      TELEGRAM_PART_TIMEOUT: ${TELEGRAM_PART_TIMEOUT:-45}
    volumes:
      # SQLite database, rclone configuration and files rebuilt by restore
      - ./data:/data
      # Folders to back up to Telegram, always read-only.
      # Add more below in the same form, then: docker compose up -d --no-deps backend
      - /mnt/documenti:/mnt/documenti:ro
      - /mnt/jotta2:/mnt/jotta2:ro
      # Destination of a download job, the only volume that is written. Without :ro, and
      # never the same folder as one of the sources above.
      # - /mnt/ripristino:/mnt/ripristino
    networks:
      - tgbackup

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    networks:
      - tgbackup

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - tgbackup

networks:
  tgbackup:
    driver: bridge
