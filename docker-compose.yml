services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET}
      TZ: ${TZ:-Europe/Rome}
      DATA_DIR: /data
    volumes:
      # SQLite database, rclone configuration and files rebuilt by restore
      - ./data:/data
      # Folders to back up to Telegram, always read-only.
      # Add more below in the same form, then: docker compose up -d --no-deps backend
      - /mnt/documenti:/mnt/documenti:ro
      - /mnt/jotta2:/mnt/jotta2:ro
    networks:
      - tgbackup

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    networks:
      - tgbackup

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - tgbackup

networks:
  tgbackup:
    driver: bridge
