[alembic]
script_location = alembic
prepend_sys_path = .

# Revisions are named 0001_description, 0002_description: the order is readable in the
# directory listing, which a random hash would not be. The number is not automatic,
# `alembic revision` has to be given --rev-id 0002. Without it the file is still created
# but it gets a hash and the listing stops being an ordered history.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# Deliberately empty: the database path comes from app.config, which already knows
# DATA_DIR. env.py builds the URL, so there is a single source of truth.
sqlalchemy.url =
