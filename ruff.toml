# 100 columns, which is what the backend was already written to.
line-length = 100
target-version = "py314"

# Without this, `app` looks like a third-party package to the import sorter and
# alembic/env.py gets its imports shuffled into the wrong block.
src = ["backend"]

# Generated by alembic revision --autogenerate. Reformatting them by hand every time a
# revision is created would fail CI on code nobody wrote.
extend-exclude = ["backend/alembic/versions"]

[lint]
select = [
    "F",    # pyflakes: unused imports, undefined names
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import order
    "UP",   # constructs superseded by newer Python
    "B",    # bugbear: mutable defaults, loop variable capture, except without cause
    "C4",   # unnecessary comprehensions
    "ASYNC",# blocking calls inside async functions
    "RUF",
]
ignore = [
    # Wants asyncio.timeout around the call instead of a timeout argument. The rclone
    # helpers take one on purpose: the caller decides how long a listing may take, and
    # the value travels down to the subprocess. See config.py.
    "ASYNC109",
]

[lint.isort]
# backend/alembic is a directory of this project, but `alembic` is the package on PyPI:
# without this the import sorter files it as first-party.
known-third-party = ["alembic"]

[lint.per-file-ignores]
# env.py is executed by alembic as a script: the module level is the entry point.
"backend/alembic/env.py" = ["E402"]
